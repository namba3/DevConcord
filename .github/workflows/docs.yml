name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.3 "**/*.md"

      - name: Validate Agent Skills
        run: python3 scripts/manage_skills.py validate

      - name: Validate documentation links and conventions
        run: python3 scripts/validate_docs.py

      - name: Test documentation validator
        run: python3 -B -m unittest discover -s tests -v
